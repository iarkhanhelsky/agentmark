        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .word {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 17px;
        letter-spacing: -0.03em;
      }
      .agent {
        fill: #141414;
      }
